
<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
</head>
<body>

    <h1>Student Management System</h1>

    <a href="{% url 'student_create' %}">
        Add New Student
    </a>

    <br><br>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Roll Number</th>
                <th>Email</th>
                <th>Age</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.roll_number }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.age }}</td>
                <td>{{ student.course }}</td>

                <td>
                    <a href="{% url 'student_update' student.pk %}">
                        Edit
                    </a>

                    <a href="{% url 'student_delete' student.pk %}">
                        Delete
                    </a>
                </td>
            </tr>

            {% empty %}
            <tr>
                <td colspan="7">No students found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
